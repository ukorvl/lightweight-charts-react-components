name: Skill evaluator calibration

on:
  pull_request:
    paths:
      - "skills/lightweight-charts-react-components/**"
      - "scripts/skill-evals/**"
      - "scripts/tests/skill-evals.test.mts"
      - "lib/**"
      - "package.json"
      - "package-lock.json"
      - ".github/**"
      - "!**/*.md"
  push:
    branches: [main]
    paths:
      - "skills/lightweight-charts-react-components/**"
      - "scripts/skill-evals/**"
      - "scripts/tests/skill-evals.test.mts"
      - "lib/**"
      - "package.json"
      - "package-lock.json"
      - ".github/**"
      - "!**/*.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  calibration:
    name: Verify evaluator with working and broken scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clone repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
      - name: Build public library
        run: npm run build -w lib
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Calibrate skill evaluator
        run: npm run test:skill-evals
      - name: Upload calibration evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skill-evaluator-calibration
          path: |
            skills/lightweight-charts-react-components-workspace/calibration-ci-*/**
            !skills/lightweight-charts-react-components-workspace/calibration-ci-*/.prepared/**
            !skills/lightweight-charts-react-components-workspace/calibration-ci-*/skill-snapshot/**
            !skills/lightweight-charts-react-components-workspace/calibration-ci-*/**/outputs/**
            !skills/lightweight-charts-react-components-workspace/calibration-ci-*/**/checks/**/app/**
          if-no-files-found: warn
          retention-days: 7
