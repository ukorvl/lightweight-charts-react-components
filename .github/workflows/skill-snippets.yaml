name: Skill code snippets

on:
  pull_request:
    paths:
      - "skills/lightweight-charts-react-components/**"
      - "scripts/skill-snippets.mts"
      - "scripts/tests/skill-snippets.test.mts"
      - "lib/**"
      - "package.json"
      - "package-lock.json"
      - ".github/**"
  push:
    branches: [main]
    paths:
      - "skills/lightweight-charts-react-components/**"
      - "scripts/skill-snippets.mts"
      - "scripts/tests/skill-snippets.test.mts"
      - "lib/**"
      - "package.json"
      - "package-lock.json"
      - ".github/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  snippets:
    name: Compile and render skill recipes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clone repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
      - name: Build public library
        run: npm run build -w lib
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Check skill snippets
        run: npm run test:skill-snippets
      - name: Upload snippet evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skill-snippets
          path: |
            .cache/skill-evals/snippets/*.json
            .cache/skill-evals/snippets/*.log
            .cache/skill-evals/snippets/*.png
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
