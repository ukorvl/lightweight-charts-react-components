name: "Check versions in sync"
description: "Checks that the library release version stays aligned across metadata and package-lock"

inputs:
  PACKAGE_JSON:
    description: "Path to the package.json file"
    required: true
    default: "lib/package.json"
  JSR_JSON:
    description: "Path to the jsr.json file"
    required: true
    default: "lib/jsr.json"
  VERSION_FILE:
    description: "Path to the version.ts file"
    required: false
    default: "lib/src/version.ts"
  PACKAGE_LOCK:
    description: "Path to the package-lock.json file"
    required: false
    default: "package-lock.json"
  LOCK_PACKAGE_KEY:
    description: "Key of the library package inside package-lock.json packages"
    required: false
    default: "lib"

runs:
  using: "composite"
  steps:
    - name: Check versions in sync
      shell: bash
      env:
        PACKAGE_JSON: ${{ inputs.PACKAGE_JSON }}
        JSR_JSON: ${{ inputs.JSR_JSON }}
        VERSION_FILE: ${{ inputs.VERSION_FILE }}
        PACKAGE_LOCK: ${{ inputs.PACKAGE_LOCK }}
        LOCK_PACKAGE_KEY: ${{ inputs.LOCK_PACKAGE_KEY }}
      run: >
        node ./scripts/check-versions-in-sync.mts
        --repo .
        --package-json "$PACKAGE_JSON"
        --jsr-json "$JSR_JSON"
        --version-file "$VERSION_FILE"
        --package-lock "$PACKAGE_LOCK"
        --lock-package-key "$LOCK_PACKAGE_KEY"
